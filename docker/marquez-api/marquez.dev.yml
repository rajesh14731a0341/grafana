server:
  applicationConnectors:
    - type: http
      port: ${MARQUEZ_PORT:-5000}
      httpCompliance: RFC7230_LEGACY
  adminConnectors:
    - type: http
      port: ${MARQUEZ_ADMIN_PORT:-5001}

logging:
  level: INFO
  loggers:
    marquez: DEBUG
  appenders:
    - type: console

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  # Optional pool tuning (can be omitted or adjusted):
  maxSize: 10
  minSize: 2
  validationQuery: "SELECT 1"

migrateOnStartup: true

graphql:
  enabled: true

search:
  enabled: ${SEARCH_ENABLED:-true}
  scheme: http
  host: ${SEARCH_HOST:-opensearch}
  port: ${SEARCH_PORT:-9200}
  username: ${SEARCH_USERNAME:-admin}
  password: ${SEARCH_PASSWORD:-admin}

tags:
  - name: PII
    description: Personally identifiable information
  - name: SENSITIVE
    description: Contains sensitive information
