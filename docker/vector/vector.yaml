sources:
  ol_input_events:
    type: http_server
    address: 0.0.0.0:8686
    encoding: json
    method: POST
    response_code: 201
    path: /api/v1/lineage
    strict_path: true
    healthcheck: true

transforms:
  remap_json_fields:
    inputs:
      - ol_input_events
    type: remap
    drop_on_error: false
    source: |
      .event = .
      .event_time = to_unix_timestamp(parse_timestamp!(.eventTime, format: "%+"))
      .event_type = .eventType
      .run_uuid = .run.runId
      .job_name = .job.name
      .job_namespace = .job.namespace
      del(.job)
      del(.eventType)
      del(.eventTime)
      del(.run)
      del(.outputs)
      del(.schemaURL)

sinks:
  clickhouse_db:
    type: clickhouse
    inputs:
      - remap_json_fields
    database: default
    endpoint: clickhouse://${CLICKHOUSE_HOST}:${CLICKHOUSE_PORT}
    table: lineage_events

  debug_file:
    type: file
    inputs:
      - ol_input_events
    encoding:
      codec: json
    path: /etc/vector/foo

  marquez_db:
    type: http
    inputs:
      - ol_input_events
    method: post
    framing:
      method: newline_delimited
    batch:
      max_events: 1
    encoding:
      codec: json
    request:
      retry_attempts: 3
      headers:
        Content-Type: application/json
    uri: ${MARQUEZ_URI}
