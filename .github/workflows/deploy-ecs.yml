name: Deploy to ECS

on:
  push:
    branches:
      - marquez_alb_prv_ip  # Your working branch

jobs:
  deploy:
    runs-on: self-hosted  # Your EC2 self-hosted runner

    steps:
      - name: Checkout repository (force clean workspace)
        uses: actions/checkout@v3
        with:
          clean: true  # Ensures old repo files like grafana/ are cleared

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 736747734611.dkr.ecr.us-east-1.amazonaws.com

      - name: Build Docker image from `docker/` directory
        run: |
          docker build -t 736747734611.dkr.ecr.us-east-1.amazonaws.com/project:0.47.0-custom -f docker/Dockerfile docker

      - name: Push Docker image to ECR
        run: |
          docker push 736747734611.dkr.ecr.us-east-1.amazonaws.com/project:0.47.0-custom

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: env/marquez
        run: terraform init

      - name: Terraform Validate
        working-directory: env/marquez
        run: terraform validate

      - name: Terraform Plan
        working-directory: env/marquez
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: env/marquez
        run: terraform apply -auto-approve tfplan
