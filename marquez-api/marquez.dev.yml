server:
  applicationConnectors:
    - type: http
      port: 5000
  adminConnectors:
    - type: http
      port: 5001

logging:
  level: INFO
  loggers:
    marquez: DEBUG

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://${MARQUEZ_POSTGRES_HOST}:${MARQUEZ_POSTGRES_PORT}/${MARQUEZ_POSTGRES_DB}
  user: ${MARQUEZ_POSTGRES_USER}
  password: ${MARQUEZ_POSTGRES_PASSWORD}
  # Optional pool tuning (can be omitted or adjusted):
  maxSize: 10
  minSize: 2
  validationQuery: "SELECT 1"
